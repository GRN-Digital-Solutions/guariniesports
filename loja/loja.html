<body>
  <a id="topo"></a>
  
  <header>
    <div class="header-wrapper">
      <!-- Navegação Desktop - Esquerda -->
      <nav class="nav-group left-nav">
        <ul>
          <li><a href="./loja.html">Shop</a></li>
          <li><a href="../sobre/sobre.html">About</a></li>
        </ul>
      </nav>
      
      <!-- Logo Central -->
      <div class="logo-center">
        <a href="../index.html" aria-label="Início" class="ativo">
          <img src="../img-site/grn-logo.png" alt="Guarini e-sport" class="header-logo">
        </a>
      </div>

      <!-- Navegação Desktop - Direita -->
      <nav class="nav-group right-nav">
        <ul>
          <li><a href="../contato/contato.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h2>PromoLoot GRN</h2>
    <section class="produtos">
      <article class="produto">
        <img src="./img-shop/curso-lobo.png" alt="Curso e-sports" />
        <h3>Do Amador ao Competitivo</h3>
        <p class="preco">R$ 29,90</p>
        <button type="button" class="btn-comprar" data-link="https://go.hotmart.com/P103681152Q">Buy</button>
      </article>

      <article class="produto" style="opacity:0.5;">
        <img src="../img-site/embreve.png" alt="Em breve" />
        <h3>Em breve</h3>
      </article>

    </section>

    <p style="text-align:center; margin-top: 2rem;">
      <a href="../index.html" class="btn-comprar">Back to Home</a>
    </p>
  </main>

  <footer>
  <div class="footer-content">
    <!-- Botões de ação no footer -->
    <div class="footer-actions">
      <!-- Botão de instalar app -->
      <button id="installBtn" class="btn-install">📱 Install App</button>
      
      <!-- Seletor de idioma customizado -->
      <div class="language-selector">
        <button class="language-btn" id="languageBtn">
          <span class="flag flag-us"></span>
          <span id="currentLang">English</span>
          <span>▼</span>
        </button>
        <div class="language-dropdown" id="languageDropdown">
          <div class="language-option" data-lang="pt" data-flag="flag-br" data-name="Português">
            <span class="flag flag-br"></span>
            <span>Português</span>
          </div>
          <div class="language-option" data-lang="en" data-flag="flag-us" data-name="English">
            <span class="flag flag-us"></span>
            <span>English</span>
          </div>
          <div class="language-option" data-lang="ja" data-flag="flag-jp" data-name="日本語">
            <span class="flag flag-jp"></span>
            <span>日本語</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Informações do footer -->
    <div class="footer-info">
        <p>&copy; © 2019 Guariní E-sport. All rights reserved.</p>
        <p><a href="https://linktr.ee/guariniesports" target="_blank">Follow us on social media!</a></p>
        <p>Created by: GRN Digital Solutions</p>
    </div>
  </div>
</footer>


  <script>
    // Redirecionar ao clicar nos botões de compra
    const botoesComprar = document.querySelectorAll('.btn-comprar[data-link]');
    botoesComprar.forEach(botao => {
      botao.addEventListener('click', () => {
        window.open(botao.getAttribute('data-link'), '_blank');
      });
    });
  </script>
  <script>
  // PWA - Botão de instalação
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('installBtn').style.display = 'block';
  });

  document.getElementById('installBtn').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('installBtn').style.display = 'none';
    console.log('Usuário respondeu:', outcome);
  });

  // Seletor de idioma customizado
  const languageBtn = document.getElementById('languageBtn');
  const languageDropdown = document.getElementById('languageDropdown');
  const currentLang = document.getElementById('currentLang');
  const languageOptions = document.querySelectorAll('.language-option');

  languageBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    languageDropdown.classList.toggle('show');
  });

  document.addEventListener('click', function(e) {
    if (!languageBtn.contains(e.target)) {
      languageDropdown.classList.remove('show');
    }
  });

  languageOptions.forEach(option => {
    option.addEventListener('click', function() {
      const lang = this.dataset.lang;
      const flag = this.dataset.flag;
      const name = this.dataset.name;
      
      const flagElement = languageBtn.querySelector('.flag');
      flagElement.className = `flag ${flag}`;
      currentLang.textContent = name;
      languageDropdown.classList.remove('show');
      
      const translateElement = document.querySelector('.goog-te-combo');
      if (translateElement) {
        translateElement.value = lang;
        translateElement.dispatchEvent(new Event('change'));
      } else {
        setTimeout(() => {
          const translateElement = document.querySelector('.goog-te-combo');
          if (translateElement) {
            translateElement.value = lang;
            translateElement.dispatchEvent(new Event('change'));
          }
        }, 1000);
      }
    });
  });
</script>

</body>
</html>
