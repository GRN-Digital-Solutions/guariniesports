  <script>
    // Redirecionar ao clicar nos botões de compra
    const botoesComprar = document.querySelectorAll('.btn-comprar[data-link]');
    botoesComprar.forEach(botao => {
      botao.addEventListener('click', () => {
        window.open(botao.getAttribute('data-link'), '_blank');
      });
    });
  </script>
  <script>
  // PWA - Botão de instalação
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('installBtn').style.display = 'block';
  });

  document.getElementById('installBtn').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('installBtn').style.display = 'none';
    console.log('Usuário respondeu:', outcome);
  });

  // Seletor de idioma customizado
  const languageBtn = document.getElementById('languageBtn');
  const languageDropdown = document.getElementById('languageDropdown');
  const currentLang = document.getElementById('currentLang');
  const languageOptions = document.querySelectorAll('.language-option');

  languageBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    languageDropdown.classList.toggle('show');
  });

  document.addEventListener('click', function(e) {
    if (!languageBtn.contains(e.target)) {
      languageDropdown.classList.remove('show');
    }
  });

  languageOptions.forEach(option => {
    option.addEventListener('click', function() {
      const lang = this.dataset.lang;
      const flag = this.dataset.flag;
      const name = this.dataset.name;
      
      const flagElement = languageBtn.querySelector('.flag');
      flagElement.className = `flag ${flag}`;
      currentLang.textContent = name;
      languageDropdown.classList.remove('show');
      
      const translateElement = document.querySelector('.goog-te-combo');
      if (translateElement) {
        translateElement.value = lang;
        translateElement.dispatchEvent(new Event('change'));
      } else {
        setTimeout(() => {
          const translateElement = document.querySelector('.goog-te-combo');
          if (translateElement) {
            translateElement.value = lang;
            translateElement.dispatchEvent(new Event('change'));
          }
        }, 1000);
      }
    });
  });
</script>
